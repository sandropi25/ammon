[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ammonizioni"
version = "0.1.0"
description = "Previsione ammonizioni Serie A"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "sqlalchemy>=2",
    "streamlit",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "respx"]
online = ["psycopg[binary]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "postgres: richiede un database Postgres reale (DATABASE_URL che inizia con postgres); altrimenti saltato",
]
