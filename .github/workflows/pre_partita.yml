name: Controllo pre-partita

on:
  schedule:
    # Ogni 10 minuti dalle 10:00 alle 20:50 UTC (12:00-22:50 ora italiana in estate, 11:00-21:50 in inverno).
    # Copre i calci d'inizio della Serie A (12:30-20:45 italiane) e della Liga (fino alle 21:00
    # spagnole, cioè le 19:00 UTC in estate e le 20:00 UTC in inverno). GitHub può ritardarlo di qualche minuto.
    - cron: "*/10 10-20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-partita
  cancel-in-progress: false

jobs:
  pre_partita:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[online]"
      - run: python -m ammonizioni.scheduler.pre_partita
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # facoltativa: la fonte predefinita (variabile vuota) e' ESPN e non vuole chiavi.
          # API_FOOTBALL_KEY serve solo con FONTE_DATI=api_football
          FONTE_DATI: ${{ vars.FONTE_DATI }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # facoltative (variabili del repository), solo per API-Football: vuote -> 100 e 30
          API_RICHIESTE_GIORNO: ${{ vars.API_RICHIESTE_GIORNO }}
          API_RISERVA_OGGI: ${{ vars.API_RISERVA_OGGI }}
