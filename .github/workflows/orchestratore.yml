name: Orchestratore orario

on:
  schedule:
    - cron: "5 * * * *" # ogni ora al minuto 05 (GitHub può ritardarlo di qualche minuto)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestratore
  cancel-in-progress: false

jobs:
  orchestratore:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # l'aggiornamento della giornata include lo storico, che si ferma da solo dopo STORICO_MAX_MINUTI (default 40)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[online]"
      - run: python -m ammonizioni.scheduler.orchestratore
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # arbitri (football-data.org, gratuita); senza chiave i job girano ma gli arbitri mancano
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          # facoltative: la fonte predefinita (variabile vuota) e' ESPN e non vuole chiavi.
          # API_FOOTBALL_KEY serve solo con FONTE_DATI=api_football
          FONTE_DATI: ${{ vars.FONTE_DATI }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # facoltative (variabili del repository), solo per API-Football: vuote -> 100 e 30
          API_RICHIESTE_GIORNO: ${{ vars.API_RICHIESTE_GIORNO }}
          API_RISERVA_OGGI: ${{ vars.API_RISERVA_OGGI }}
          # minuti massimi dello storico in una notte (vuoto -> 40)
          STORICO_MAX_MINUTI: ${{ vars.STORICO_MAX_MINUTI }}
